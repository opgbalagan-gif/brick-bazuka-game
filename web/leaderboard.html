<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071f38"><meta name="brick-api" content="__API_URL__">
<title>Рейтинг — BRICK BAZUKA</title>
<style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#153e50,#041321 70%);color:#f5f8ee;font:16px/1.45 Arial,sans-serif;min-height:100svh;padding:24px 16px calc(24px + env(safe-area-inset-bottom))}main{max-width:580px;margin:auto}a{color:#a7ef70}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.brand{font-weight:900;letter-spacing:1px;font-size:14px}.play{background:#80df41;color:#11230b;text-decoration:none;font-weight:bold;border-radius:9px;padding:12px 18px}h1{font-size:36px;line-height:1.1;margin:0 0 10px}p{color:#aec0cb;margin:0 0 22px}.card{border:1px solid #345667;background:#071f38;border-radius:16px;padding:20px;margin:18px 0}label{display:block;color:#aec0cb;font-size:13px;margin-bottom:8px}.profile{display:flex;gap:8px}input{width:100%;min-width:0;background:#061420;border:1px solid #557181;border-radius:9px;color:#f5f8ee;padding:12px;font-size:18px}input:focus{outline:2px solid #80df41}input[readonly]{border-color:transparent;background:transparent;padding-left:0;font-weight:bold}button{background:#12334b;color:#f5f8ee;border:1px solid #557181;border-radius:9px;padding:10px 14px;min-height:44px;font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible,a:focus-visible{outline:2px solid #80df41;outline-offset:3px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px}h2{font-size:21px;margin:0}table{width:100%;border-collapse:collapse;table-layout:fixed;margin-top:18px}th{font-size:12px;color:#829dac;font-weight:normal;text-align:left;padding:8px 0}th:first-child{width:36px}th:last-child{width:100px;text-align:right}td{padding:13px 0;border-top:1px solid #17384a;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}td:first-child{color:#80df41}td:last-child{text-align:right;font-weight:bold;font-variant-numeric:tabular-nums}.status{font-size:13px;color:#aec0cb;min-height:38px;margin:14px 0 0}.empty{text-align:center;padding:34px 0;color:#aec0cb}.note{font-size:12px;margin-top:10px}#name-status{margin:8px 0 0;font-size:12px;min-height:18px}@media(max-width:380px){h1{font-size:30px}.card{padding:15px}button{padding:10px}th:last-child{width:80px}}
</style><script src="leaderboard.js" defer></script>
</head>
<body><main>
<header><span class="brand">BRICK BAZUKA</span><a class="play" href="./">ИГРАТЬ ↗</a></header>
<h1>Общий рейтинг</h1><p>Лучшие забеги. Таблица обновляется автоматически.</p>
<section class="card" aria-label="Имя игрока"><label for="player-name">Твоё имя на этом устройстве</label>
<form class="profile" id="profile-form"><input id="player-name" maxlength="20" autocomplete="nickname" placeholder="Введи имя" required><button id="edit-name" type="submit">Готово</button></form><p id="name-status" role="status"></p></section>
<section class="card" aria-label="Таблица результатов"><div class="heading"><h2>Топ-10</h2><button id="refresh" type="button">Обновить</button></div>
<table><thead><tr><th>№</th><th>Игрок</th><th>Очки</th></tr></thead><tbody id="scores"></tbody></table><div id="empty" class="empty">Подключаемся к рейтингу…</div><p class="status" id="board-status" role="status" aria-live="polite"></p></section>
<p class="note">При временном сбое показываем последнюю загруженную таблицу с датой обновления. Имя хранится в этом браузере; на другом устройстве его нужно указать отдельно.</p>
</main></body></html>
